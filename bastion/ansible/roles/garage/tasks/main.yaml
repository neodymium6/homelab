---
- name: Validate Garage configuration
  ansible.builtin.assert:
    that:
      - garage_version | string | length > 0
      - garage_checksum is match('^sha256:[0-9a-f]{64}$')
      - garage_replication_factor | int == 1
      - garage_s3_port | int >= 1
      - garage_s3_port | int <= 65535
      - garage_managed_buckets | length > 0
      - garage_client_secrets is mapping
      - garage_rpc_secret is match('^[0-9a-fA-F]{64}$')
      - garage_admin_token | string | length >= 32
      - garage_metrics_token | string | length >= 32
      - garage_proxy_ip | string | length > 0
    fail_msg: >-
      Configure Garage buckets, clients, and secrets.garage values in
      cluster.yaml. This role supports a single-node backup store only.
  no_log: true

- name: Check Garage storage mount
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ garage_storage_mount_path }}"
  register: garage_storage_mount
  changed_when: false
  failed_when: false

- name: Require Garage storage to be mounted
  ansible.builtin.assert:
    that:
      - garage_storage_mount.rc == 0
      - garage_base_path != garage_storage_mount_path
      - garage_base_path.startswith(garage_storage_mount_path ~ '/')
    fail_msg: >-
      {{ garage_storage_mount_path }} must be mounted and garage_base_path must
      be a child of that mount before Garage is deployed.

- name: Ensure Garage group exists
  ansible.builtin.group:
    name: "{{ garage_group }}"
    system: true
    state: present

- name: Ensure Garage user exists
  ansible.builtin.user:
    name: "{{ garage_user }}"
    group: "{{ garage_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Ensure Garage storage directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ garage_user }}"
    group: "{{ garage_group }}"
    mode: "0700"
  loop:
    - "{{ garage_base_path }}"
    - "{{ garage_metadata_dir }}"
    - "{{ garage_data_dir }}"
    - "{{ garage_metadata_snapshots_dir }}"

- name: Install Garage binary
  ansible.builtin.get_url:
    url: "{{ garage_download_url }}"
    dest: "{{ garage_binary_path }}"
    checksum: "{{ garage_checksum }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart Garage

- name: Deploy Garage configuration
  ansible.builtin.template:
    src: garage.toml.j2
    dest: "{{ garage_config_path }}"
    owner: root
    group: "{{ garage_group }}"
    mode: "0640"
  no_log: true
  notify: Restart Garage

- name: Remove legacy Garage bootstrap environment
  ansible.builtin.file:
    path: "/etc/garage.env"
    state: absent
  notify: Restart Garage

- name: Deploy Garage systemd unit
  ansible.builtin.template:
    src: garage.service.j2
    dest: "/etc/systemd/system/{{ garage_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Garage

- name: Apply pending Garage restarts
  ansible.builtin.meta: flush_handlers

- name: Ensure Garage is enabled and running
  ansible.builtin.systemd:
    name: "{{ garage_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Garage S3 API
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ garage_s3_port }}"
    state: started
    timeout: 60

- name: Check Garage cluster status
  ansible.builtin.command:
    argv:
      - "{{ garage_binary_path }}"
      - status
  changed_when: false

- name: Validate managed Garage bucket definitions
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
      - item.clients is defined
      - item.clients | length > 0
    fail_msg: "Each Garage bucket must have a valid name and at least one client."
  loop: "{{ garage_managed_buckets }}"
  loop_control:
    label: "{{ item.name | default('invalid bucket') }}"

- name: Require unique managed Garage bucket names
  ansible.builtin.assert:
    that:
      - >-
        garage_managed_buckets | map(attribute='name') | list | unique | length
        == garage_managed_buckets | length
    fail_msg: "Garage bucket names must be unique."

- name: Initialize managed Garage client list
  ansible.builtin.set_fact:
    garage_managed_clients: []

- name: Build managed Garage client list
  ansible.builtin.set_fact:
    garage_managed_clients: >-
      {{
        garage_managed_clients
        + [
          item.1
          | combine({'bucket': item.0.name})
        ]
      }}
  loop: "{{ query('subelements', garage_managed_buckets, 'clients') }}"
  loop_control:
    label: "{{ item.0.name }} / {{ item.1.name | default('invalid client') }}"

- name: Validate managed Garage client definitions and secrets
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | string | length > 0
      - item.credentials_ref is defined
      - item.credentials_ref in garage_client_secrets
      - item.permissions is defined
      - item.permissions.read is defined
      - item.permissions.write is defined
      - item.permissions.owner is defined
      - garage_client_secrets[item.credentials_ref].access_key_id | default('') is match('^GK.+$')
      - garage_client_secrets[item.credentials_ref].secret_access_key | default('') | string | length >= 32
    fail_msg: >-
      Each Garage client must reference valid credentials and explicitly set
      read, write, and owner permissions.
  loop: "{{ garage_managed_clients }}"
  no_log: true

- name: Check managed Garage buckets
  ansible.builtin.command:
    argv:
      - "{{ garage_binary_path }}"
      - bucket
      - info
      - "{{ item.name }}"
  loop: "{{ garage_managed_buckets }}"
  loop_control:
    label: "{{ item.name }}"
  register: garage_managed_bucket_checks
  changed_when: false
  failed_when: false

- name: Create missing managed Garage buckets
  ansible.builtin.command:
    argv:
      - "{{ garage_binary_path }}"
      - bucket
      - create
      - "{{ item.item.name }}"
  loop: "{{ garage_managed_bucket_checks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0

- name: Configure managed Garage clients
  ansible.builtin.include_tasks: manage_client.yaml
  loop: "{{ garage_managed_clients }}"
  loop_control:
    loop_var: garage_managed_client
    label: "{{ garage_managed_client.bucket }} / {{ garage_managed_client.name }}"

- name: Allow proxy to reach Garage S3 API
  community.general.ufw:
    rule: allow
    proto: tcp
    src: "{{ garage_proxy_ip }}"
    port: "{{ garage_s3_port | string }}"
  when: garage_enable_ufw | bool
  become: true
