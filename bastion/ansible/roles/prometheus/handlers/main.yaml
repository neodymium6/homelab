---
- name: Reload prometheus
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ prometheus_compose_path }}"
      - kill
      - --signal
      - SIGHUP
      - "{{ prometheus_service_name }}"
  become: true

- name: Restart prometheus
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ prometheus_compose_path }}"
      - restart
  become: true
